<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Carrossel Infinity</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <aside class="sidebar glass">
            <div class="hero-section">
                <div class="header-actions">
                    <button id="theme-toggle" class="theme-btn"
                        title="Mudar Tema">
                        🎨 <span>Tema</span>
                    </button>
                    <button id="clear-all-btn" class="theme-btn btn-danger"
                        title="Limpar Todas as Tarefas">
                        🗑️ <span>Limpar</span>
                    </button>
                </div>
                <div id="current-date">-- de --</div>
                <div id="current-time">00:00</div>
            </div>
            <div class="input-section">
                <label>Nova Tarefa</label>
                <input type="text" id="todo-input" placeholder="O que fazer?">
                <label>Data Limite</label>
                <input type="date" id="todo-date">
                <label>Repetição</label>
                <div class="custom-select-wrapper">
                    <select id="todo-repeat" class="glass-input"
                        onchange="toggleLimitInput()">
                        <option value="none">Não repetir</option>
                        <option value="daily">Diariamente</option>
                        <option value="weekly">Semanalmente</option>
                        <option value="monthly">Mensalmente</option>
                    </select>
                    <i class="fas fa-chevron-down arrow-icon"></i>
                </div>
                <div id="limit-wrapper"
                    style="display: none; margin-top: 10px;">
                    <label>Quantas vezes?</label>
                    <input type="number" id="repeat-limit" class="glass-input"
                        value="1" min="1" placeholder="Ex: 5">
                </div>
                <button id="add-btn">Agendar Tarefa</button>
            </div>
            <button id="view-completed-btn" class="completed-trigger"
                onclick="openModal()">CONCLUÍDOS</button>
            <div class="stats-panel">
                <div class="progress-circle" id="main-progress">
                    <div class="inner-circle">0%</div>
                </div>
                <div class="stat-info">
                    <span id="completed-count">0/0 tarefas</span>
                    <small>Progresso Geral</small>
                </div>
            </div>
        </aside>
        <main class="timeline-container">
            <button class="nav-btn prev"
                onclick="moveCarousel(-1)">&#10094;</button>
            <div id="dynamic-timeline" class="timeline"></div>
            <button class="nav-btn next"
                onclick="moveCarousel(1)">&#10095;</button>
        </main>
    </div>
    <div id="modal-completed" class="modal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2>Tarefas Concluídas</h2>
                <div class="modal-actions">
                    <button onclick="limparConcluidos()" class="reset-btn"
                        title="Limpar tudo">
                        <i class="fas fa-trash-arrow-up"></i> Resetar
                    </button>
                    <button onclick="closeModal()" class="close-modal">
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>
            </div>
            <ul id="completed-list-full" class="completed-list"></ul>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
